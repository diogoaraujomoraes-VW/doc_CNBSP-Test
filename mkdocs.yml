site_name: Documentação SIGNO - Envio de Atos
site_description: Parâmetros para envio de atos por cartórios no sistema SIGNO
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - navigation.top

nav:
  - Home: index.md
  - CEP:
    - API: cep_api.md
    - Upload: cep_upload.md
  - CESDI:
    - API: cesdi_api.md
    - Upload: cesdi_upload.md
  - RCTO:
    - API: rcto_api.md
    - Upload: rcto_upload.md
  - Domínios Compartilhados: dominios.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
